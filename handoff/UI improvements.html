<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fakeagent — UI improvements</title>
<link rel="stylesheet" href="styles.css" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #050608;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    color: #d8e0e6;
  }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Starter components -->
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <!-- Our screens -->
  <script type="text/babel" src="setup-screen.jsx"></script>
  <script type="text/babel" src="terminal-screen.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const { useState } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "showSetup": true,
      "showRunning": true,
      "showCrisis": true,
      "fontSize": 13
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      return (
        <>
          <DesignCanvas title="fakeagent · UI improvements" subtitle="every screenshot's pain points, addressed">
            {t.showSetup && (
              <DCSection id="setup" title="01 · Setup screen">
                <DCArtboard id="setup-improved" label="Amped-up entry — fake telemetry, loud Run, live forecast" width={1240} height={1280}>
                  <SetupScreen />
                </DCArtboard>
              </DCSection>
            )}

            {t.showRunning && (
              <DCSection id="running" title="02 · Terminal · running">
                <DCArtboard id="terminal-running" label="Color-coded log badges · ASCII bars · ticking metrics · confidence meter" width={1480} height={920}>
                  <TerminalScreen mode="running" />
                </DCArtboard>
              </DCSection>
            )}

            {t.showCrisis && (
              <DCSection id="crisis" title="03 · Terminal · cascade + app reveal">
                <DCArtboard id="terminal-crisis" label="Glitch overlay · red flicker · pop-in 'real' app · shake on crash" width={1480} height={920}>
                  <TerminalScreen mode="crisis" />
                </DCArtboard>
              </DCSection>
            )}
          </DesignCanvas>

          <TweaksPanel title="Tweaks">
            <TweakSection label="Artboards">
              <TweakToggle label="Setup screen" value={t.showSetup} onChange={(v) => setTweak('showSetup', v)} />
              <TweakToggle label="Terminal · running" value={t.showRunning} onChange={(v) => setTweak('showRunning', v)} />
              <TweakToggle label="Terminal · crisis" value={t.showCrisis} onChange={(v) => setTweak('showCrisis', v)} />
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
